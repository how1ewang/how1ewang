<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="50 releases in six months, 800+ members, 17 product areas, 20 countries, 11 partner integrations, 1 person">
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .n { font-size: 48px; font-weight: 700; letter-spacing: -2px; fill: #1d1d1f; }
    .l { font-size: 15px; font-weight: 400; fill: #6e6e73; }
    .a { fill: #0071e3; }
    .hl { stroke: #000000; stroke-opacity: 0.10; stroke-width: 1; }
  </style>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" class="hl"/>
  <g class="hl">
    <line x1="200.5" y1="34" x2="200.5" y2="134"/>
    <line x1="400.5" y1="34" x2="400.5" y2="134"/>
    <line x1="600.5" y1="34" x2="600.5" y2="134"/>
    <line x1="800.5" y1="34" x2="800.5" y2="134"/>
    <line x1="1000.5" y1="34" x2="1000.5" y2="134"/>
  </g>
  <g class="f" text-anchor="middle">
    <text x="100" y="88" class="n">50</text><text x="100" y="120" class="l">releases in six months</text>
    <text x="300" y="88" class="n">800+</text><text x="300" y="120" class="l">members on the platform</text>
    <text x="500" y="88" class="n">17</text><text x="500" y="120" class="l">product areas delivered</text>
    <text x="700" y="88" class="n">20</text><text x="700" y="120" class="l">countries served</text>
    <text x="900" y="88" class="n">11</text><text x="900" y="120" class="l">partner integrations</text>
    <text x="1100" y="88" class="n a">1</text><text x="1100" y="120" class="l">person, end to end</text>
  </g>
</svg>
