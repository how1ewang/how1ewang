<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="126K lines of code, 300+ automated tests, 37 database migrations, 100 UI pages, 11 integrations, 1 engineer">
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .n { font-size: 48px; font-weight: 700; letter-spacing: -2px; fill: #f5f5f7; }
    .l { font-size: 15px; font-weight: 400; fill: #a1a1a6; }
    .a { fill: #2997ff; }
    .hl { stroke: #ffffff; stroke-opacity: 0.14; stroke-width: 1; }
  </style>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" class="hl"/>
  <g class="hl">
    <line x1="200.5" y1="34" x2="200.5" y2="134"/>
    <line x1="400.5" y1="34" x2="400.5" y2="134"/>
    <line x1="600.5" y1="34" x2="600.5" y2="134"/>
    <line x1="800.5" y1="34" x2="800.5" y2="134"/>
    <line x1="1000.5" y1="34" x2="1000.5" y2="134"/>
  </g>
  <g class="f" text-anchor="middle">
    <text x="100" y="88" class="n">126K</text><text x="100" y="120" class="l">lines of code</text>
    <text x="300" y="88" class="n">300+</text><text x="300" y="120" class="l">automated tests</text>
    <text x="500" y="88" class="n">37</text><text x="500" y="120" class="l">database migrations</text>
    <text x="700" y="88" class="n">100</text><text x="700" y="120" class="l">UI pages shipped</text>
    <text x="900" y="88" class="n">11</text><text x="900" y="120" class="l">third-party integrations</text>
    <text x="1100" y="88" class="n a">1</text><text x="1100" y="120" class="l">engineer</text>
  </g>
</svg>
